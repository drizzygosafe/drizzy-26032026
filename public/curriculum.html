<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F3F5F9;--card:#fff;--ink:#1A1F2E;--mute:#586074;--line:#D9DFEA;--road:#1B2030;--sign:#FFC62B;--on-sign:#1B2030;--go:#0B6B49;--go-bg:#E2F4EC;--hero-ink:#F4F6FB;--hero-mute:#BAC2D3;--focus:#2F6BFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10131B;--card:#1A1F2C;--ink:#EDF0F7;--mute:#A3ACBF;--line:#2B3244;--road:#0B0E15;--go:#6FE0AF;--go-bg:#15312A;--focus:#8FB0FF}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10131B;--card:#1A1F2C;--ink:#EDF0F7;--mute:#A3ACBF;--line:#2B3244;--road:#0B0E15;--go:#6FE0AF;--go-bg:#15312A;--focus:#8FB0FF}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
.hero{position:relative;background:var(--road);color:var(--hero-ink);padding:24px 20px 64px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:24px;height:4px;background:repeating-linear-gradient(90deg,var(--sign) 0 36px,transparent 36px 64px)}
.top{display:flex;align-items:center;gap:12px}
.logo{width:72px;height:72px;border-radius:10px;background:var(--sign);color:var(--on-sign);display:grid;place-items:center;font:800 22px "Bricolage Grotesque",sans-serif}
.top b{font:800 20px "Bricolage Grotesque",sans-serif}
.top span{color:var(--hero-mute);font-size:14px}
h1{font-size:clamp(36px,7vw,64px);line-height:1.02;letter-spacing:-.025em;font-weight:800;max-width:15ch;margin:40px 0 14px}
.lede{max-width:52ch;color:var(--hero-mute);margin:0 0 28px;font-size:17px}
.picker{display:grid;gap:14px}
.seg{display:inline-flex;width:max-content;max-width:100%;background:rgba(255,255,255,.1);border-radius:999px;padding:4px}
.seg button,.durs button{border:0;background:transparent;color:var(--hero-ink);font-weight:600;border-radius:999px;padding:10px 22px}
.durs{display:flex;flex-wrap:wrap;gap:8px}
.durs button{border:1.5px solid rgba(255,255,255,.3);padding:9px 16px}
.seg button[aria-pressed=true],.durs button[aria-pressed=true]{background:var(--sign);color:var(--on-sign);border-color:var(--sign)}
.layout{max-width:1080px;margin:0 auto;padding:28px 20px 64px;display:grid;gap:20px}
.nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.nav button{white-space:nowrap;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.nav h2{display:none}
@media (min-width:900px){.layout{grid-template-columns:230px 1fr;gap:44px}.nav{position:sticky;top:20px;align-self:start;flex-direction:column;overflow:visible}.nav button{white-space:normal;border-radius:12px}.nav h2{display:block;font-size:14px;color:var(--mute);font-weight:600;margin:0 0 2px}}
.head h2{font-size:clamp(26px,4vw,36px);line-height:1.1;letter-spacing:-.015em;font-weight:800}
.head p{color:var(--mute);margin:8px 0 14px}
.tools{display:flex;gap:8px;margin-bottom:26px}
.tools button{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
.wk{position:relative;padding-left:44px;margin-bottom:30px}
.wk::before{content:"";position:absolute;left:14px;top:48px;bottom:10px;border-left:3px dashed var(--line)}
.wk h3{font-size:22px;line-height:1.2;font-weight:700;margin:0 0 14px;margin-left:-44px}
.wk.flat h3{display:none}
.day{position:relative;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.day summary{display:flex;align-items:center;gap:12px;padding:13px 16px;list-style:none;font-weight:600;cursor:pointer}
.day summary::-webkit-details-marker{display:none}
.day summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .15s}
.day[open] summary::after{transform:rotate(-135deg)}
.mk{position:absolute;left:-44px;top:9px;width:32px;height:32px;border-radius:50%;background:var(--sign);color:var(--on-sign);border:3px solid var(--bg);display:grid;place-items:center;font-size:13px;font-weight:800}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.body{display:grid;gap:18px;padding:2px 18px 18px}
@media (min-width:720px){.body{grid-template-columns:1.5fr 1fr}}
.body h4{margin:0 0 6px;font-size:15px;font-weight:700}
.body ul{margin:0;padding-left:18px}
.body li{margin:0 0 5px}
.body li.lb{list-style:none;margin:12px 0 4px -18px;font-weight:700}
.goals{background:var(--go-bg);color:var(--ink);border-radius:10px;padding:14px 16px;align-self:start}
.goals h4{color:var(--go)}
.add h3{font-size:22px;margin-bottom:12px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
footer{max-width:1080px;margin:0 auto;padding:0 20px 40px;color:var(--mute);font-size:14px}
</style>
</head>

<script>
const D=JSON.parse(document.getElementById('d').textContent);
const find=id=>D.find(c=>c.id===id);
const types=['Manual','Automatic'],lens=[...new Set(D.map(c=>c.days))].sort((a,b)=>a-b);
let cur=find(location.hash.slice(1))||find('manual-28');
const li=p=>p.l?`<li class="lb">${p.t}</li>`:`<li>${p.t}</li>`;
const day=(d,i)=>`<details class="day"${i===0?' open':''}><summary><span class="mk" aria-hidden="true">${d.n}</span><span class="sr">Day ${d.n}: </span>${d.title}</summary><div class="body"><div><h4>Practice</h4><ul>${d.practice.map(li).join('')}</ul></div>${d.goals.length?`<div class="goals"><h4>Goals</h4><ul>${d.goals.map(li).join('')}</ul></div>`:''}</div></details>`;
function paint(){
  const c=cur,weeks=c.weeks.filter(w=>w.name).length;
  document.getElementById('seg').innerHTML=types.map(t=>`<button aria-pressed="${t===c.type}" data-t="${t}">${t}</button>`).join('');
  document.getElementById('durs').innerHTML=lens.map(n=>`<button aria-pressed="${n===c.days}" data-n="${n}">${n} days</button>`).join('');
  const nav=c.weeks.filter(w=>w.name).map((w,i)=>`<button data-go="wk${i}">Week ${w.n}: ${w.name}</button>`);
  if(c.addons.length)nav.push('<button data-go="add">Add-ons</button>');
  document.getElementById('nav').innerHTML=nav.length?'<h2>On this page</h2>'+nav.join(''):'';
  document.getElementById('nav').hidden=!nav.length;
  let k=0;
  document.getElementById('out').innerHTML=`<div class="head"><h2>${c.title}</h2><p>${c.days} sessions${weeks>1?` across ${weeks} weeks`:''}. Open a day to see its practice list and goals.</p></div>
  <div class="tools"><button data-all="1">Expand all</button><button data-all="0">Collapse all</button></div>`+
  c.weeks.map((w,i)=>`<section class="wk${w.name?'':' flat'}" id="wk${i}"><h3>Week ${w.n}: ${w.name||''}</h3>${w.days.map(d=>day(d,k++)).join('')}</section>`).join('')+
  (c.addons.length?`<section class="add" id="add"><h3>Add-ons during the course</h3><ul class="chips">${c.addons.map(a=>`<li>${a}</li>`).join('')}</ul></section>`:'');
  document.title=c.title+' | Drizzy';
}
function pick(type,n){const c=D.find(x=>x.type===type&&x.days===n);if(c){cur=c;history.replaceState(null,'','#'+c.id);paint();}}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t)pick(b.dataset.t,cur.days);
  else if(b.dataset.n)pick(cur.type,+b.dataset.n);
  else if(b.dataset.go){const el=document.getElementById(b.dataset.go);if(el){el.querySelector('details')&&(el.querySelector('details').open=true);el.scrollIntoView({block:'start'});}}
  else if(b.dataset.all)document.querySelectorAll('#out details').forEach(d=>d.open=b.dataset.all==='1');
});
addEventListener('hashchange',()=>{const c=find(location.hash.slice(1));if(c&&c!==cur){cur=c;paint();}});
paint();
</script>
